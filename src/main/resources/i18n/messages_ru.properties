feature.description=Для каждого ZIP с положительной численностью населения и хотя бы одним корректным значением market_value\nвыводятся зарегистрированные нарушения на 1 000 жителей и средняя рыночная стоимость недвижимости (USD).\nУчитываются все штаты регистрации автомобиля; для ZIP без записей о нарушениях используется нулевое количество.\nПоследняя строка — ранговая корреляция Спирмена между ZIP-кодами.\n
